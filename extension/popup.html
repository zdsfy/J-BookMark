<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #FAF9F6; --card: #fff; --ink: #1B1E22; --ink2: #5C6470;
    --ink3: #8B939E; --border: #E7E4DD; --accent: #A16207;
    --accent-soft: #F5ECD9; --dead: #B91C1C; --ok: #15803D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 360px; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .head {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    border-bottom: 1px solid var(--border); background: var(--card);
  }
  .head img { width: 22px; height: 22px; }
  .head .title { font-weight: 700; font-size: 15px; flex: 1; }
  .head .gear { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--ink2); }
  .head .gear:hover { color: var(--accent); }
  .save-box { padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--card); }
  .save-box .cur { font-size: 12px; color: var(--ink2); margin-bottom: 8px; word-break: break-all; }
  .save-box .cur b { color: var(--ink); font-weight: 600; }
  .save-row { display: flex; gap: 8px; }
  .save-row input {
    flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 13px; outline: none;
  }
  .save-row input:focus { border-color: var(--accent); }
  .save-row select {
    padding: 8px 6px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; outline: none;
  }
  .save-row button {
    padding: 8px 14px; border: none; border-radius: 7px; background: var(--accent);
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .save-row button:disabled { opacity: .55; cursor: default; }
  .tags-input { margin-top: 8px; }
  .tags-input input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; outline: none; }
  .msg { margin-top: 8px; font-size: 12.5px; min-height: 18px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--dead); }
  .search-box { padding: 10px 14px; }
  .search-box input {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 13px; outline: none; background: var(--card);
  }
  .search-box input:focus { border-color: var(--accent); }
  .list { max-height: 320px; overflow-y: auto; padding: 0 6px 8px; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 8px;
    cursor: pointer;
  }
  .item:hover { background: var(--accent-soft); }
  .item .fav {
    width: 26px; height: 26px; flex-shrink: 0; border-radius: 6px; overflow: hidden;
    background: #eee; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; color: var(--accent);
  }
  .item .fav img { width: 16px; height: 16px; }
  .item .meta { flex: 1; min-width: 0; }
  .item .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .h { font-size: 11px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .go { color: var(--ink3); font-size: 14px; }
  .foot { padding: 8px 14px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--ink3); }
  .empty { text-align: center; color: var(--ink3); padding: 24px 10px; font-size: 13px; }
</style>
</head>
<body>
  <div class="head">
    <span class="title">我的书签</span>
    <button class="gear" id="btn-options" title="设置">⚙</button>
  </div>

  <div class="save-box" id="save-box">
    <div class="cur" id="cur-page">加载当前标签页…</div>
    <div class="save-row">
      <input id="save-title" placeholder="标题" maxlength="200">
      <select id="save-cat" title="分类"><option value="">未分类</option></select>
      <button id="btn-save">保存</button>
    </div>
    <div class="tags-input" style="display:none" id="tags-wrap">
      <input id="save-tags" placeholder="标签，逗号分隔（可选）">
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="search-box">
    <input id="search" type="search" placeholder="搜索书签…">
  </div>
  <div class="list" id="list"></div>
  <div class="foot">共 <span id="count">0</span> 条书签</div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
